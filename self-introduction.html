<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自己紹介 - 山田太郎</title>
</head>

<body>
    <!-- メインタイトル -->
    <h1>自己紹介</h1>

    <!-- プロフィール -->
    <h2>プロフィール</h2>
    <p>名前: 佐々木裕貴</p>
    <p>年齢: 43歳</p>
    <p>出身地: 北海道</p>
    <p>趣味: 競馬鑑賞、アニメ鑑賞</p>

    <!-- 好きなもの -->
    <h2>好きなもの</h2>
    <ul>
        <li>そぼろご飯</li>
        <li>キーマカレー</li>
        <li>卵かけご飯</li>
    </ul>

    <!-- 今年の目標 -->
    <h2>今年の目標</h2>
    <ol>
        <li>コードの基本構造を覚える</li>
        <li>毎日コードを書く</li>
        <li>毎日ログインする</li>
    </ol>

    <!-- リンク -->
    <h2>リンク</h2>
    <a href="https://github.com/yamada-taro" target="_blank">私のGitHub</a>

    <!-- 好きな風景 -->
    <h2>好きな風景</h2>
    <img src="landscape.jpg" alt="好きな風景" width="400">

    <!-- お問い合わせフォーム -->
    <h2>お問い合わせ</h2>
    <form action="/submit" method="POST">
        <div>
            <label for="contact-name">お名前:</label>
            <input type="text" id="contact-name" name="name" required>
        </div>
        <div>
            <label for="contact-category">お問い合わせ種別:</label>
            <select id="contact-category" name="category">
                <option value="">-- 選択してください --</option>
                <option value="general">一般的なお問い合わせ</option>
                <option value="feedback">ご意見・ご要望</option>
            </select>
        </div>
        <div>
            <label for="contact-message">お問い合わせ内容:</label>
            <textarea id="contact-message" name="message" rows="5" required></textarea>
        </div>
        <div>
            <button type="submit">送信する</button>
        </div>
    </form>
</body>

</html>
